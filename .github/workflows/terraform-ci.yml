# No Azure credentials needed — mock_provider intercepts all API calls
# terraform_version ~>1.9 — test framework GA in 1.6+; matches local dev
name: Terraform CI
on:
  push: { branches: ["main", "master"] }
  pull_request: { branches: ["main", "master"] }
jobs:
  terraform:
    name: Terraform Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "~>1.9"
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: "~>0.64"
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Test
        run: terraform test
      - name: TFLint Init
        run: tflint --init
      - name: TFLint
        run: tflint --recursive
